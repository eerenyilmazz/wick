<style>
        body {
            background-color: #0F0A14;
            color: #f9dcd6;

            overflow: hidden;
        }

        .sticker-rotate {
            transform: rotate(-3deg);
        }

        .active-scale:active {

        }

            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="flex flex-col min-h-screen">
<!-- Top App Bar (As defined in JSON, but modified for transactional/onboarding flow context) -->
<header class="w-full top-0 sticky flex justify-between items-center px-margin-mobile py-sm z-10">
<div class="font-headline-lg-mobile text-headline-lg-mobile font-black text-primary tracking-tighter uppercase italic">
            WICK
        </div>
<button class="material-symbols-outlined text-on-surface-variant hover:opacity-80 active:scale-95 transition-all">
            close
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile text-center">
<!-- Sticker Visual Container -->
<div class="relative mb-xl group">
<!-- Background Glow -->
<div class="absolute inset-0 bg-primary-container opacity-20 blur-3xl rounded-full scale-150"></div>
<!-- Chunky Box Sticker -->
<div class="relative sticker-rotate bg-surface-container-high w-48 h-48 rounded-[2.5rem] flex items-center justify-center border-4 border-surface-container-highest shadow-2xl transition-transform duration-300 hover:rotate-3 group-hover:scale-105">
<span class="material-symbols-outlined text-primary-container !text-[80px]" style="font-variation-settings: 'FILL' 1;">
                    location_on
                </span>
<!-- Accent Dot (Small secondary sticker) -->
<div class="absolute -top-4 -right-2 bg-primary w-12 h-12 rounded-2xl rotate-12 flex items-center justify-center border-2 border-background">
<span class="material-symbols-outlined text-background !text-xl" style="font-variation-settings: 'FILL' 1;">
                        navigation
                    </span>
</div>
</div>
</div>
<!-- Typography Cluster -->
<div class="space-y-sm max-w-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background">
                Yakınındaki insanları bul
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant px-md">
                Konumunu paylaşarak sana en yakın eşleşmeleri gösterebiliriz
            </p>
</div>
<!-- Atmospheric Visuals (Bento-style backgrounds) -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<!-- Decorative circle to break up space -->
<div class="absolute -bottom-20 -left-20 w-80 h-80 bg-primary opacity-[0.03] rounded-full blur-3xl"></div>
<div class="absolute top-20 -right-20 w-64 h-64 bg-tertiary opacity-[0.03] rounded-full blur-3xl"></div>
</div>
</main>
<!-- Footer Actions -->
<footer class="p-margin-mobile flex flex-col items-center space-y-md pb-xl">
<!-- Primary Button -->
<button class="w-full py-md bg-primary-container text-on-primary font-button-text text-button-text rounded-full shadow-[0_0_20px_rgba(255,90,54,0.3)] active-scale transition-all hover:brightness-110">
            Konuma izin ver
        </button>
<!-- Secondary Text Link -->
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-background underline decoration-on-surface-variant/30 underline-offset-[4px] transition-colors">
            Şimdi değil
        </button>
</footer>
<script>
        // Micro-interaction for the "sticker" visual
        const sticker = document.querySelector('.sticker-rotate');
        if (sticker) {
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
                sticker.style.transform = `rotate(-3deg) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
            
            document.addEventListener('mouseleave', () => {
                sticker.style.transform = `rotate(-3deg) rotateY(0deg) rotateX(0deg)`;
            });
        }

        // Action Handlers
        document.querySelector('button.bg-primary-container').addEventListener('click', () => {
            console.log("Requesting Location Permission...");
            // Real implementation would call browser geolocation API here
        });
    </script>
