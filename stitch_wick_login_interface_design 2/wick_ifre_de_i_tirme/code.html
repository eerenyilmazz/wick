<!DOCTYPE html>

<html class="dark" lang="tr"><head>

                        "secondary": "#d1c1d9",
                        "surface-bright": "#473531",
                        "on-primary-container": "#5a0c00",
                        "surface-container-highest": "#42312d",
                        "outline-variant": "#5b403a",
                        "tertiary-container": "#00a0ba",
                        "error-container": "#93000a",
                        "secondary-container": "#504559",
                        "on-secondary-fixed": "#211829",
                        "on-secondary-fixed-variant": "#4e4256",
                        "inverse-surface": "#f9dcd6",
                        "secondary-fixed-dim": "#d1c1d9",
                        "error": "#ffb4ab",
                        "on-background": "#f9dcd6",
                        "on-surface": "#f9dcd6",
                        "tertiary-fixed": "#aaedff",
                        "on-surface-variant": "#E3BEB6",
                        "on-secondary": "#372c3f",
                        "surface-variant": "#42312d",
                        "on-primary-fixed-variant": "#8c1900",

                        "on-error-container": "#ffdad6",

                        "primary-fixed": "#ffdad2",
                        "surface-tint": "#ffb4a3",
                        "secondary-fixed": "#eeddf6",
                        "primary-container": "#ff5a36",
                        "surface-container-lowest": "#180b08",
                        "on-primary-fixed": "#3d0600",

                    "fontFamily": {

                        "button-text": ["16px", {"lineHeight": "24px", "fontWeight": "700"}]

<style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #0F0A14;
            color: #f9dcd6;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-focus-ring:focus-within {
            border: 2px solid #ff5a36;
        }
        .chunky-button {
            transition: transform 0.15s ease, opacity 0.2s ease;
        }
        .chunky-button:active {
            transform: scale(0.96);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-background w-full top-0 sticky z-50 flex items-center justify-between px-margin-mobile py-sm">
<button aria-label="Geri" class="hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary text-headline-md font-headline-md">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-extrabold flex-1 text-center">Şifreni değiştir</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow flex flex-col px-margin-mobile pt-lg pb-xl">
<!-- Visual Accent - Sticker style -->
<div class="mb-lg flex justify-center">
<div class="w-20 h-20 bg-surface-container-highest rounded-3xl flex items-center justify-center transform -rotate-3 shadow-lg border border-outline-variant/20">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl text-center max-w-xs mx-auto">
            Hesabının güvenliğini korumak için periyodik olarak şifreni güncellemen önerilir.
        </p>
<!-- Form Section -->
<form class="space-y-sm">
<!-- Current Password -->
<div class="group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-base">Mevcut şifre</label>
<div class="relative flex items-center bg-[#241A2C] rounded-input input-focus-ring transition-all duration-200 h-[64px] px-sm">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-lg text-body-lg placeholder:opacity-30" id="current-password" placeholder="••••••••" type="password"/>
<button class="text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword('current-password')" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- New Password -->
<div class="group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-base">Yeni şifre</label>
<div class="relative flex items-center bg-[#241A2C] rounded-input input-focus-ring transition-all duration-200 h-[64px] px-sm">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-lg text-body-lg placeholder:opacity-30" id="new-password" placeholder="En az 8 karakter" type="password"/>
<button class="text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword('new-password')" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Confirm New Password -->
<div class="group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-base">Yeni şifreyi tekrar gir</label>
<div class="relative flex items-center bg-[#241A2C] rounded-input input-focus-ring transition-all duration-200 h-[64px] px-sm">
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-lg text-body-lg placeholder:opacity-30" id="confirm-password" placeholder="Tekrar yazın" type="password"/>
<button class="text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword('confirm-password')" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
</form>
<div class="mt-md text-center">
<a class="font-label-md text-label-md text-primary font-bold uppercase tracking-wider border-b-2 border-primary/30 pb-0.5 hover:opacity-80 transition-opacity" href="#">
                Şifremi unuttum
            </a>
</div>
</main>
<!-- Footer Action -->
<footer class="p-margin-mobile mb-4">
<button class="chunky-button w-full bg-primary-container text-on-primary py-sm rounded-full font-button-text text-button-text shadow-[0_4px_20px_rgba(255,90,54,0.3)] hover:brightness-110">
            Şifreyi güncelle
        </button>
</footer>
<!-- Success Modal (Hidden by default) -->
<div class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-background/90 backdrop-blur-sm p-margin-mobile" id="success-modal">
<div class="bg-surface-container rounded-3xl p-lg w-full max-w-sm text-center shadow-2xl border border-outline-variant/30">
<div class="w-16 h-16 bg-primary/20 rounded-full flex items-center justify-center mx-auto mb-md">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Başarılı!</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg">Şifren başarıyla güncellendi. Yeni şifrenle giriş yapmaya devam edebilirsin.</p>
<button class="w-full py-sm bg-surface-container-highest rounded-full font-button-text text-on-surface hover:bg-surface-bright transition-colors" onclick="closeModal()">
                Kapat
            </button>
</div>
</div>
<script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('span');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Simple interaction demo for the update button
        document.querySelector('.chunky-button').addEventListener('click', function() {
            const btn = this;
            btn.innerHTML = '<span class="flex items-center justify-center"><svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-on-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Güncelleniyor...</span>';
            
            setTimeout(() => {
                document.getElementById('success-modal').classList.remove('hidden');
                btn.innerHTML = 'Şifreyi güncelle';
            }, 1200);
        });

        function closeModal() {
            document.getElementById('success-modal').classList.add('hidden');
        }
    </script>
</body></html>
