<style>
        body {
            background-color: #0F0A14;
            color: #f9dcd6;
            font-family: 'Manrope', sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .crop-overlay {
            background-color: rgba(15, 10, 20, 0.85);
            backdrop-filter: blur(2px);
        }

        .crop-window {
            box-shadow: 0 0 0 1000px rgba(15, 10, 20, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .crop-handle {
            width: 24px;
            height: 24px;
            background: #FFFFFF;
            border-radius: 4px;
            position: absolute;
            z-index: 20;
        }

        .handle-tl { top: -4px; left: -4px; }
        .handle-tr { top: -4px; right: -4px; }
        .handle-bl { bottom: -4px; left: -4px; }
        .handle-br { bottom: -4px; right: -4px; }

        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ff5a36;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 90, 54, 0.4);
            border: 3px solid #0F0A14;
        }

        .tilt-card {
            transform: rotate(-1deg);
        }

        .active-nav-bg {
            background: #ff5a36;
            color: #5a0c00;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="h-screen flex flex-col items-center justify-between overflow-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface flex justify-between items-center px-margin-mobile py-sm z-50">
<button class="font-button-text text-button-text text-on-surface hover:opacity-80 transition-opacity active:scale-95 duration-200">
            Vazgeç
        </button>
<h1 class="font-headline-md text-headline-md-mobile text-on-surface tracking-tight">
            Fotoğrafı Düzenle
        </h1>
<button class="font-button-text text-button-text text-primary-container font-bold hover:opacity-80 transition-opacity active:scale-95 duration-200">
            Kullan
        </button>
</header>
<!-- Main Canvas Area -->
<main class="relative w-full flex-1 flex flex-col items-center justify-center p-4">
<!-- Background Animation Effect -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none">

</div>
<div class="relative w-full max-w-md aspect-[3/4] flex items-center justify-center overflow-hidden rounded-2xl z-10">
<!-- The Image to be Cropped -->
<img class="absolute inset-0 w-full h-full object-cover scale-110" data-alt="A cinematic, high-contrast close-up portrait of a stylish young adult with warm, orange rim lighting against a deep purple and obsidian background. The visual style is modern and edgy, reminiscent of high-end dating app photography with a moody, atmospheric glow. The subject has a confident expression, and the overall composition feels tactile and alive with subtle digital grain." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrZRsVql0oKc2P5fPEY4lWRZ5xu1Al7M3o3M7T68-5k4S4nXHtH7JA0X0nrfz_JVpGq3YeZxNtNoxzbUnt6GxPm2orAvByzSURBrfXbIApzeGc8RcaNEXgZ4pE4eDh1j6eoJBOZqvz43hXYSJtPciOOzJDWtRub7g7-jmGPfC-U54yrM9h9V2jHAgruj7B-NvGIM-AsZ1uhkj9Q1R0HKd2pFGobFrFpMGN01e0GRx624e_dQtpaJsSOrE8_oDllypOent9NuGiT4k"/>
<!-- Crop Overlay System -->
<div class="absolute inset-0 pointer-events-none">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[85%] aspect-square crop-window rounded-sm">
<!-- Grid Lines -->
<div class="absolute inset-0 grid grid-cols-3 grid-rows-3 opacity-20">
<div class="border-r border-b border-white/40"></div>
<div class="border-r border-b border-white/40"></div>
<div class="border-b border-white/40"></div>
<div class="border-r border-b border-white/40"></div>
<div class="border-r border-b border-white/40"></div>
<div class="border-b border-white/40"></div>
<div class="border-r border-white/40"></div>
<div class="border-r border-white/40"></div>
<div></div>
</div>
<!-- Handles -->
<div class="crop-handle handle-tl"></div>
<div class="crop-handle handle-tr"></div>
<div class="crop-handle handle-bl"></div>
<div class="crop-handle handle-br"></div>
</div>
</div>
</div>
<!-- Zoom Slider -->
<div class="w-full max-w-md px-8 mt-12 mb-8 z-20">
<div class="flex items-center justify-between mb-4">
<span class="material-symbols-outlined text-on-surface-variant text-sm">remove</span>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">ÖLÇEK</span>

</div>

<button class="flex flex-col items-center justify-center text-on-surface-variant p-3 hover:bg-surface-variant rounded-full transition-all duration-150 active:scale-90">
<span class="material-symbols-outlined" data-icon="image">image</span>
<span class="font-label-md text-label-md mt-1">Galeri</span>
</button>

<span class="material-symbols-outlined" data-icon="crop" style="font-variation-settings: 'FILL' 1;">crop</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-3 hover:bg-surface-variant rounded-full transition-all duration-150 active:scale-90">
<span class="material-symbols-outlined" data-icon="tune">tune</span>
<span class="font-label-md text-label-md mt-1">Ayar</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-3 hover:bg-surface-variant rounded-full transition-all duration-150 active:scale-90">
<span class="material-symbols-outlined" data-icon="auto_fix_high">auto_fix_high</span>
<span class="font-label-md text-label-md mt-1">Sihir</span>
</button>
</nav>
<!-- Interactive Floating Stickers (Atmospheric) -->
<div class="fixed top-24 right-4 tilt-card bg-surface-container-high p-3 rounded-xl border border-white/5 opacity-80 pointer-events-none select-none z-0">
<span class="material-symbols-outlined text-primary-container text-2xl" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<script>
        // Simple Interaction logic
        const slider = document.querySelector('input[type=range]');
        const image = document.querySelector('img[src="placeholder"]');
        
        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            image.style.transform = `scale(${val})`;
        });

        // Add haptic-like feel to buttons
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.transition = 'transform 0.1s ease';
            });
        });
    </script>
</body></html>
