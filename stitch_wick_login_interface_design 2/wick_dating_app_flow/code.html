                    "surface": "#1E100D",
                    "outline-variant": "#5B403A",
                    "background": "#0F0A14",
                    "primary-container": "#ff5a36",

                    "on-surface-variant": "#E3BEB6",

<style>
        body {
            background-color: #0F0A14;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        @keyframes pulse-dots {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .loading-dot {
            animation: pulse-dots 1.4s infinite ease-in-out both;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        
        .sticker-shadow {
            box-shadow: 0 10px 30px -5px rgba(255, 90, 54, 0.3);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<!-- Brand Anchor Shell Logic (As specified for the TopAppBar JSON configuration, though used here as the central branding core) -->
<main class="flex flex-col items-center justify-between w-full h-screen py-xl px-margin-mobile">
<!-- Center Content -->
<div class="flex-1 flex flex-col items-center justify-center">
<!-- Logo Box (Sticker Aesthetic) -->
<div class="relative group">
<!-- Subtle Glow behind the sticker -->
<div class="absolute inset-0 bg-primary-container blur-2xl opacity-20 scale-125"></div>
<div class="w-32 h-32 bg-primary-container rounded-[20px] -rotate-[4deg] flex items-center justify-center sticker-shadow transition-transform duration-500 hover:rotate-0 active:scale-95">
<!-- Icon: Exact string from JSON instructions if mapped, but here using "local_fire_department" as specified -->
<span class="material-symbols-outlined text-[64px] text-on-primary-fixed" data-icon="local_fire_department" style="font-variation-settings: 'FILL' 1;">
                        local_fire_department
                    </span>
</div>
</div>
<!-- Brand Name: High-impact typography -->
<div class="mt-lg">
<h1 class="font-headline-xl text-headline-xl text-on-background tracking-tighter uppercase font-black">
                    WICK
                </h1>
</div>
</div>
<!-- Subtle Loading Indicator at bottom -->
<div class="flex gap-xs pb-xl">
<div class="loading-dot w-2 h-2 rounded-full" style="background-color: #7A6E84;"></div>
<div class="loading-dot w-2 h-2 rounded-full" style="background-color: #7A6E84;"></div>
<div class="loading-dot w-2 h-2 rounded-full" style="background-color: #7A6E84;"></div>
</div>
</main>
<!-- Micro-interaction for haptic-feel rotation -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const logoBox = document.querySelector('.sticker-shadow');
            
            // Random subtle wiggle animation every few seconds to feel "alive"
            setInterval(() => {
                const randomRotate = (Math.random() * 4 - 6).toFixed(2); // between -6 and -2
                logoBox.style.transform = `rotate(${randomRotate}deg)`;
                
                setTimeout(() => {
                    logoBox.style.transform = `rotate(-4deg)`;
                }, 300);
            }, 4000);

            // Active state interaction
            logoBox.addEventListener('touchstart', () => {
                logoBox.classList.add('scale-95');
            });
            logoBox.addEventListener('touchend', () => {
                logoBox.classList.remove('scale-95');
            });
        });
    </script>
</body></html>
