<style>

<body class="flex flex-col h-screen max-w-[1080px] mx-auto overflow-hidden">
<!-- TopAppBar -->

<button class="active-scale text-on-surface hover:opacity-80 transition-transform">

</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-mobile pt-20 pb-24">
<!-- Profile Card Container -->
<div class="relative w-full aspect-[3/4] max-h-[618px] rounded-[24px] overflow-hidden bg-surface-container shadow-2xl border border-white/5 transition-all duration-500 hover:rotate-1">
<!-- Atmospheric Shader Overlay -->

<!-- Profile Image -->
<div class="w-full h-full bg-cover bg-center bg-no-repeat" data-alt="A cinematic, high-contrast portrait of a charismatic 26-year-old man with a confident expression. The lighting is moody and dramatic, featuring warm orange rim lights that contrast against a deep purple and obsidian background. The visual style is energetic and edgy, mimicking a high-end streetwear photography session for a premium lifestyle brand like Wick. The mood is modern, urban, and slightly mysterious." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAA9bbiha7ZN9phhcwqn04lue8wi5Rx3uLR2nvWjQ587S2C1XhU9UBe4cayyfVLVJM1YM1SzLQmEBNpOG6CgA-ya2i4lkoPthTEPNwETQAoewEWF6MA6KOW9KyqKXn4E6BL3ei404GuJnqwF8NdIsrhoEGpszBWTsnztvoTrERYy8O8wjd7CR0IFTZ5eIVvlVlzALnAKnz2LDFYtwYqYmjh84kBbOHHC5hHFZVRnPBRxX0y0BBIQoXl8imVIBEcKSYahM7FOrSXQz4')">
</div>
<!-- Gradient Information Overlay -->
<div class="absolute bottom-0 left-0 w-full h-1/2 glass-gradient flex flex-col justify-end p-md">
<div class="space-y-xs">
<div class="flex items-center gap-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Can, 26</h1>
<span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
<div class="flex items-center gap-base text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">location_on</span>
<span class="font-body-md text-body-md opacity-80">2 km yakınında</span>
</div>
</div>
</div>
<!-- Profile Sticker Detail -->
<div class="absolute top-md right-md flex flex-col gap-xs items-end">
<div class="bg-surface-container-low/80 backdrop-blur-md p-xs rounded-xl rotate-3 border border-white/10">
<span class="material-symbols-outlined text-primary">local_fire_department</span>
</div>
</div>
</div>

<div class="flex flex-col items-center gap-xs">

<div class="fixed inset-0 pointer-events-none -z-10">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-surface-variant/20 blur-[100px] rounded-full"></div>
</div>
<script>
        // Simple micro-interaction for the card tilt
        const card = document.querySelector('.relative.rounded-\\[24px\\]');
        if (card) {
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });

            document.addEventListener('mouseleave', () => {
                card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            });
        }
    </script>
