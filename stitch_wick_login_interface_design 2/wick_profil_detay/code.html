<!-- Interaction Script -->
<script>
        const gallery = document.getElementById('gallery');
        const dots = document.querySelectorAll('.active-dot, .inactive-dot');

        gallery.addEventListener('scroll', () => {
            const scrollIndex = Math.round(gallery.scrollLeft / gallery.clientWidth);
            dots.forEach((dot, index) => {
                if(index === scrollIndex) {
                    dot.className = 'h-1.5 active-dot rounded-full transition-all duration-300';
                } else {
                    dot.className = 'h-1.5 inactive-dot rounded-full transition-all duration-300';
                }
            });
        });

        // Add haptic-like scaling on button press
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.classList.add('scale-95');
            });
            btn.addEventListener('touchend', () => {
                btn.classList.remove('scale-95');
            });
        });
    </script>
