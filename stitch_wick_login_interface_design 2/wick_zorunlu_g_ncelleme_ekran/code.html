<body class="flex items-center justify-center min-h-screen p-margin-mobile">
<!-- Atmospheric Background Shader -->

<main class="relative z-10 w-full max-w-md flex flex-col items-center text-center">
<!-- Header Branding (Non-navigational) -->
<div class="mb-xl">
<span class="font-headline-xl text-headline-xl italic font-black text-primary tracking-tighter">WICK</span>
</div>
<!-- Mandatory Update Card (Sticker Style) -->
<div class="sticker-card bg-surface-container-high p-lg rounded-xl shadow-2xl border border-white/5 relative overflow-hidden mb-lg">
<!-- Decorative Inner Glow -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-container/20 rounded-full blur-3xl"></div>
<!-- Update Icon in Rounded Box -->
<div class="inline-flex items-center justify-center w-20 h-20 bg-primary-container rounded-xl mb-md rotate-3 shadow-lg shadow-primary-container/30">
<span class="material-symbols-outlined text-4xl text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                    system_update_alt
                </span>
</div>
<!-- Typography Content -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-sm leading-tight">
                Yeni bir sürüm seni bekliyor
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant px-xs opacity-80">
                Daha iyi bir deneyim ve yeni özellikler için Wick'i güncellemen gerekiyor. Endişelenme, ateşin sönmeyecek!
            </p>
</div>
<!-- Call to Action -->
<div class="w-full mt-md">
<button class="w-full py-sm px-xl bg-primary-container text-on-primary-container font-button-text text-button-text rounded-full glow-button transition-all duration-200 active:scale-95 hover:opacity-90 flex items-center justify-center gap-base">
                Şimdi güncelle
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Subtle Branding Anchor -->
<div class="mt-xl opacity-40">
<p class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">V 2.4.0 • STABLE</p>
</div>
</main>
<!-- Background Decoration: Floating "Stickers" -->
<div class="absolute top-20 left-10 opacity-10 rotate-12 hidden md:block">
<span class="material-symbols-outlined text-8xl text-primary">local_fire_department</span>
</div>
<div class="absolute bottom-20 right-10 opacity-10 -rotate-12 hidden md:block">
<span class="material-symbols-outlined text-8xl text-primary">favorite</span>
</div>
<script>
        // Simple micro-interaction for the button
        const updateBtn = document.querySelector('button');
        updateBtn.addEventListener('click', () => {
            console.log('Redirecting to store...');
            // In a real app, this would trigger the app store link
        });

        // Background subtle parallax effect
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            const card = document.querySelector('.sticker-card');
            
            const rotateX = (y - 0.5) * 10;
            const rotateY = (x - 0.5) * -10;
            
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) rotate(-2deg)`;
        });
    </script>
