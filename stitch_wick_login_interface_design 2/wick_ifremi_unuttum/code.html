<style>
        body {
            background-color: #0F0A14;
            color: #f9dcd6;
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .sticker-rotate {
            transform: rotate(-3deg);
        }
        .brand-glow {
            box-shadow: 0 0 20px rgba(255, 90, 54, 0.3);
        }
        input:focus {
            outline: none;
        }
        .custom-bounce:active {
            transform: scale(0.95);
            transition: transform 0.1s ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full top-0 bg-transparent flex items-center px-margin-mobile h-16 z-50">
<button class="material-symbols-outlined text-primary hover:opacity-80 active:scale-95 transition-transform" data-icon="arrow_back">
            arrow_back
        </button>
</header>
<!-- Main Content -->
<main class="flex-grow px-margin-mobile pt-sm flex flex-col">
<!-- Identity Section (Animated Sticker-style focus) -->
<div class="mb-lg mt-base">
<div class="inline-flex items-center justify-center bg-secondary-container p-4 rounded-[24px] sticker-rotate mb-sm">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">
                    local_fire_department
                </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-xs">
                Şifreni mi unuttun?
            </h1>
<p class="font-body-lg text-body-lg text-[#7A6E84] max-w-[280px]">
                E-postana bir sıfırlama linki göndereceğiz
            </p>
</div>
<!-- Form Section -->
<div class="space-y-sm">
<div class="group relative">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="alternate_email">
                        alternate_email
                    </span>
</div>
<input class="w-full h-16 pl-12 pr-4 bg-[#241A2C] border-none text-on-background placeholder:text-[#7A6E84] font-body-md text-body-md rounded-[18px] transition-all duration-300 focus:ring-2 focus:ring-primary-container" placeholder="E-posta" type="email"/>
</div>
</div>
<!-- Atmospheric Element (Background Mesh/Glow) -->
<div class="fixed top-1/2 -right-20 w-64 h-64 bg-primary-container opacity-5 blur-[120px] rounded-full -z-10"></div>
<div class="fixed bottom-1/4 -left-20 w-80 h-80 bg-secondary-container opacity-5 blur-[120px] rounded-full -z-10"></div>
</main>
<!-- Bottom Action Section -->
<footer class="p-margin-mobile pb-12">
<button class="w-full h-16 bg-primary-container text-on-primary font-button-text text-button-text rounded-full brand-glow custom-bounce transition-all hover:brightness-110">
            Sıfırlama linki gönder
        </button>
<div class="mt-lg text-center">
<p class="font-label-md text-label-md text-[#7A6E84]">
                Hala sorun mu yaşıyorsun? 
                <a class="text-primary font-bold ml-1 border-b-[2px] border-primary/30" href="#">Destek Al</a>
</p>
</div>
</footer>
<!-- Decorative Canvas for 2025 Aesthetic -->
<div class="fixed top-20 right-8 opacity-20 pointer-events-none sticker-rotate hidden md:block">
<div class="bg-surface-container-highest p-4 rounded-xl border border-outline-variant">
<span class="material-symbols-outlined text-tertiary" data-icon="key">key</span>
</div>
</div>
<script>
        // Simple micro-interaction for the back button
        document.querySelector('[data-icon="arrow_back"]').addEventListener('click', () => {
            window.history.back();
        });

        // Add visual feedback to input focus
        const emailInput = document.querySelector('input[type="email"]');
        const icon = document.querySelector('[data-icon="alternate_email"]');
        
        emailInput.addEventListener('focus', () => {
            emailInput.parentElement.classList.add('scale-[1.02]');
            emailInput.parentElement.style.transition = 'transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
        });

        emailInput.addEventListener('blur', () => {
            emailInput.parentElement.classList.remove('scale-[1.02]');
        });
    </script>
</body></html>
