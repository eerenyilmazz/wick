<style>
        body {
            background-color: #0F0A14;
            color: #f9dcd6;
            font-family: 'Manrope', sans-serif;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
        }
        .chunky-shadow {
            box-shadow: 0 10px 0px 0px rgba(0, 0, 0, 0.3);
        }
        .brand-glow:hover {
            box-shadow: 0 0 20px rgba(255, 90, 54, 0.4);
        }
        .sticker-rotate {
            transform: rotate(-3deg);
        }
        .icon-tilt {
            transform: rotate(12deg);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="flex flex-col min-h-screen">
<!-- Header (Based on TopAppBar) -->
<header class="w-full top-0 sticky bg-background flex items-center justify-between px-margin-mobile h-16 z-50">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform" onclick="window.history.back()">
<span class="material-symbols-outlined" style="font-size: 32px;">arrow_back</span>
</button>
<div class="font-headline-xl text-headline-xl italic font-black text-primary tracking-tighter">WICK</div>
<div class="w-8"></div> <!-- Spacer for centering title if needed by JSON type -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile text-center pb-xl">
<!-- 1. Centered Visual (Sticker Style) -->
<div class="relative mb-xl sticker-rotate">
<div class="w-48 h-48 bg-surface-container-high rounded-chunky flex items-center justify-center chunky-shadow">
<div class="bg-primary-container p-6 rounded-2xl icon-tilt">
<span class="material-symbols-outlined text-background" style="font-size: 80px;">mail</span>
</div>
</div>
<!-- Decorative atmospheric particles (Pure CSS) -->
<div class="absolute -top-4 -right-4 w-8 h-8 bg-tertiary rounded-full opacity-20 blur-xl animate-pulse"></div>
<div class="absolute -bottom-6 -left-4 w-12 h-12 bg-primary rounded-full opacity-10 blur-xl animate-bounce" style="animation-duration: 3s;"></div>
</div>
<!-- 2. Heading -->
<h1 class="font-headline-xl text-headline-xl-mobile md:text-headline-xl text-on-surface mb-sm">
            E-postanı kontrol et
        </h1>
<!-- 3. Description -->
<p class="font-body-lg text-body-lg text-brand-grey-purple max-w-sm mb-xl">
<span class="text-on-surface-variant font-bold">ornek@email.com</span> adresine bir sıfırlama linki gönderdik
        </p>
<!-- 4. Primary Button -->
<div class="w-full flex justify-center mb-md">
<button class="bg-primary-container text-background font-button-text text-button-text px-10 py-4 rounded-full chunky-shadow brand-glow active:scale-95 transition-all duration-200">
                E-posta uygulamasını aç
            </button>
</div>
<!-- 5. Secondary Link -->
<button class="group flex flex-col items-center gap-1 active:opacity-70 transition-opacity">
<span class="font-label-md text-label-md text-brand-grey-purple font-bold tracking-widest uppercase">
                Tekrar gönder
            </span>
<div class="h-0.5 w-8 bg-brand-grey-purple opacity-30 group-hover:w-full transition-all duration-300"></div>
</button>
</main>
<!-- Background Atmospheric Effect (Inline Scripted Micro-interaction) -->
<div class="fixed inset-0 pointer-events-none z-0 opacity-10" id="glow-follow"></div>
<script>
        // Subtle mouse/touch follow glow for atmosphere
        const glow = document.getElementById('glow-follow');
        window.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            glow.style.background = `radial-gradient(circle at ${x}px ${y}px, #FF5A36 0%, transparent 40%)`;
        });

        // Simulating the "Opening Mail App" interaction
        document.querySelector('.bg-primary-container').addEventListener('click', function() {
            this.innerText = "Yönlendiriliyor...";
            setTimeout(() => {
                this.innerText = "E-posta uygulamasını aç";
            }, 2000);
        });
    </script>
</body></html>
