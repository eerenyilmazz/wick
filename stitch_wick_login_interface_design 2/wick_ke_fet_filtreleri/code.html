<style>
      body {
        background-color: #0F0A14;
        color: #f9dcd6;
        font-family: 'Manrope', sans-serif;
        overflow-x: hidden;
      }
      
      .range-slider {
        position: relative;
        width: 100%;
        height: 8px;
        background: #2b1c18;
        border-radius: 99px;
      }
      
      .range-track {
        position: absolute;
        height: 100%;
        background: #ff5a36;
        border-radius: 99px;
      }
      
      .range-thumb {
        position: absolute;
        width: 24px;
        height: 24px;
        background: #ffb4a3;
        border: 4px solid #ff5a36;
        border-radius: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 10px rgba(255, 90, 54, 0.4);
        cursor: pointer;
      }

      .chunky-card {
        background: #1e100d;
        border-radius: 24px;
        padding: 24px;
        transition: transform 0.2s ease;
      }
      
      .chunky-card:active {
        transform: scale(0.98) rotate(-1deg);
      }

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-background">
<div class="flex items-center active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="close">close</span>
</div>
<h1 class="font-headline-md text-headline-md font-extrabold text-on-surface">Filtreler</h1>
<button class="font-label-md text-label-md text-primary-container font-bold hover:opacity-90 active:scale-95 transition-transform">
            Sıfırla
        </button>
</header>
<!-- Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-margin-mobile space-y-lg">
<!-- Age Range Section -->
<section class="space-y-sm">
<div class="flex justify-between items-end">
<label class="font-headline-md text-headline-md text-on-surface">Yaş aralığı</label>
<span class="font-body-lg text-body-lg text-primary-container font-bold">18 - 35</span>
</div>
<div class="chunky-card py-10 relative">
<div class="range-slider">
<div class="range-track" style="left: 10%; right: 50%;"></div>
<div class="range-thumb" style="left: 10%;"></div>
<div class="range-thumb" style="left: 50%;"></div>
</div>
</div>
</section>
<!-- Distance Section -->
<section class="space-y-sm">
<div class="flex justify-between items-end">
<label class="font-headline-md text-headline-md text-on-surface">Mesafe</label>
<span class="font-body-lg text-body-lg text-primary-container font-bold">50 km içinde</span>
</div>
<div class="chunky-card py-10 relative">
<div class="range-slider">
<div class="range-track" style="left: 0%; right: 40%;"></div>
<div class="range-thumb" style="left: 60%;"></div>
</div>
</div>
</section>
<!-- Gender Preference Section -->
<section class="space-y-sm">
<label class="font-headline-md text-headline-md text-on-surface">Cinsiyet tercihi</label>
<div class="flex bg-surface-container rounded-3xl p-1 gap-1 h-14">
<button class="flex-1 rounded-[20px] font-button-text text-button-text text-on-surface-variant flex items-center justify-center transition-all">Kadın</button>
<button class="flex-1 rounded-[20px] bg-primary-container font-button-text text-button-text text-on-primary-container flex items-center justify-center shadow-lg shadow-primary-container/20">Erkek</button>
<button class="flex-1 rounded-[20px] font-button-text text-button-text text-on-surface-variant flex items-center justify-center transition-all">Herkes</button>
</div>
</section>
<!-- Decorative "Sticker" Card -->
<div class="pt-4">
<div class="chunky-card border-2 border-dashed border-outline-variant flex items-center gap-md rotate-2">
<div class="w-12 h-12 bg-primary-container rounded-xl flex items-center justify-center -rotate-6">
<span class="material-symbols-outlined text-on-primary-container" data-icon="auto_awesome">auto_awesome</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface">Akıllı Eşleşme</p>
<p class="text-xs text-on-surface-variant">Tercihlerinize göre en iyi adayları öne çıkarıyoruz.</p>
</div>
</div>
</div>
</main>
<!-- Sticky Bottom Action -->
<footer class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-background via-background to-transparent pt-10">
<button class="w-full h-16 bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-full shadow-lg shadow-primary-container/30 active:scale-95 transition-all flex items-center justify-center gap-sm">
            Filtreleri uygula
        </button>
</footer>
<!-- BottomNavBar (Hidden on transactional filter screen as per shell mandate) -->
<!-- Exclusion: Page intent is Task-Focused sub-page featuring a "Close" action. Navigation suppressed. -->
<script>
        // Simple micro-interactions for the segmented control
        const genderButtons = document.querySelectorAll('.flex.bg-surface-container button');
        genderButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                genderButtons.forEach(b => {
                    b.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-lg', 'shadow-primary-container/20');
                    b.classList.add('text-on-surface-variant');
                });
                btn.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-lg', 'shadow-primary-container/20');
                btn.classList.remove('text-on-surface-variant');
                
                // Add a little haptic feel
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => btn.style.transform = 'scale(1)', 100);
            });
        });

        // Toggle reset button
        const resetBtn = document.querySelector('header button');
        resetBtn.addEventListener('click', () => {
            resetBtn.classList.add('opacity-50');
            setTimeout(() => resetBtn.classList.remove('opacity-50'), 200);
        });
    </script>
</body></html>
