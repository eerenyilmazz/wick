<style>
        body {
            background-color: #0F0A14;
            color: #f9dcd6;
            margin: 0;
            overflow: hidden;
            font-family: 'Manrope', sans-serif;
        }

        .maintenance-glow {
            box-shadow: 0 0 60px 10px rgba(255, 90, 54, 0.15);
        }

        .animate-tilt {
            animation: tilt 6s ease-in-out infinite;
        }

        @keyframes tilt {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(3deg); }
        }

        .flicker-animation {
            animation: flicker 4s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
            52% { opacity: 0.9; }
            54% { opacity: 0.7; }
        }

        .pulse-soft {
            animation: pulse-soft 3s ease-in-out infinite;
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col items-center justify-center min-h-screen p-margin-mobile">
<!-- Atmospheric Background Effects -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary-container/10 blur-[120px] rounded-full pulse-soft"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[50%] h-[50%] bg-secondary-container/5 blur-[150px] rounded-full pulse-soft" style="animation-delay: 1.5s;"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 flex flex-col items-center text-center max-w-lg w-full">
<!-- Logo/Icon Sticker -->
<div class="mb-xl relative">
<div class="bg-surface-container-high p-lg rounded-xl border border-outline-variant/30 rotate-3 animate-tilt maintenance-glow relative z-10">
<span class="material-symbols-outlined text-[80px] leading-none text-primary-container flicker-animation" data-icon="local_fire_department" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<!-- Secondary Sticker behind -->
<div class="absolute -top-4 -right-4 bg-surface-container-low p-sm rounded-lg border border-outline-variant/20 -rotate-12 z-0 opacity-50">
<span class="material-symbols-outlined text-[32px] text-on-surface-variant" data-icon="settings">settings</span>
</div>
</div>
<!-- Typography Section -->
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background mb-sm tracking-tight">
            Wick şu an bakımda
        </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-80 px-sm leading-relaxed">
            Sana daha iyi hizmet verebilmek için kısa bir mola verdik. Birkaç dakika içinde geri döneceğiz ve ateşi yeniden yakacağız!
        </p>
</main>
<!-- Footer Status -->
<footer class="fixed bottom-xl left-0 w-full flex justify-center px-margin-mobile">
<div class="flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-primary-container animate-pulse shadow-[0_0_8px_rgba(255,90,54,0.6)]"></span>
<span class="font-label-md text-label-md text-on-surface-variant/60 uppercase tracking-[0.2em]">
                Birkaç dakika içinde geri döneceğiz
            </span>
</div>
</footer>
<!-- Interactive Layer -->
<script>
        // Subtle mouse tracking for the atmospheric glow
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const sticker = document.querySelector('.animate-tilt');
            if (sticker) {
                const moveX = (x - 0.5) * 15;
                const moveY = (y - 0.5) * 15;
                sticker.style.transform = `rotate(${3 + moveX * 0.1}deg) translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Periodic flicker boost
        setInterval(() => {
            const icon = document.querySelector('.flicker-animation');
            if (icon) {
                icon.style.textShadow = '0 0 20px rgba(255, 90, 54, 0.4)';
                setTimeout(() => {
                    icon.style.textShadow = 'none';
                }, 150);
            }
        }, 5000);
    </script>
</body></html>
