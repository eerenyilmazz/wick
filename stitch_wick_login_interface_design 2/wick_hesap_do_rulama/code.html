<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cameraArea = document.querySelector('.camera-guideline');
            
            // Subtle pulse effect for the guideline
            let opacity = 0.6;
            let direction = -0.01;
            
            function pulse() {
                opacity += direction;
                if (opacity <= 0.3 || opacity >= 0.7) direction *= -1;
                cameraArea.style.opacity = opacity;
                requestAnimationFrame(pulse);
            }
            
            pulse();

            // Simple click feedback
            const mainButton = document.querySelector('.chunky-button');
            mainButton.addEventListener('click', () => {
                const flash = document.createElement('div');
                flash.className = 'fixed inset-0 bg-white z-[100] pointer-events-none opacity-0 transition-opacity duration-100';
                document.body.appendChild(flash);
                
                setTimeout(() => flash.style.opacity = '0.8', 10);
                setTimeout(() => {
                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 100);
                }, 150);
            });
        });
    </script>
