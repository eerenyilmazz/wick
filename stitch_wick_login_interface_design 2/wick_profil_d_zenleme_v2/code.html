<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "surface": "#1E100D",
              "secondary": "#d1c1d9",
              "on-tertiary-container": "#003039",
              "on-error-container": "#ffdad6",
              "on-tertiary": "#003640",
              "surface-dim": "#1e100d",
              "inverse-primary": "#b52603",
              "outline-variant": "#5b403a",
              "on-primary-fixed": "#3d0600",
              "secondary-container": "#504559",
              "surface-variant": "#42312d",
              "surface-container-highest": "#42312d",
              "on-primary": "#630f00",
              "surface-container-low": "#271814",
              "on-error": "#690005",
              "tertiary-fixed-dim": "#5fd6f1",
              "surface-container-lowest": "#180b08",
              "primary-fixed-dim": "#ffb4a3",
              "on-secondary-container": "#c3b3cb",
              "on-primary-fixed-variant": "#8c1900",
              "on-background": "#f9dcd6",
              "surface-container": "#2b1c18",
              "tertiary-container": "#00a0ba",
              "on-secondary-fixed-variant": "#4e4256",
              "secondary-fixed": "#eeddf6",
              "primary-container": "#ff5a36",
              "tertiary": "#5fd6f1",
              "inverse-surface": "#f9dcd6",
              "primary-fixed": "#ffdad2",
              "tertiary-fixed": "#aaedff",
              "inverse-on-surface": "#3e2c28",
              "surface-container-high": "#372622",
              "on-tertiary-fixed-variant": "#004e5c",
              "surface-tint": "#ffb4a3",
              "outline": "#aa8982",
              "on-surface-variant": "#E3BEB6",
              "error": "#ffb4ab",
              "on-secondary": "#372c3f",
              "secondary-fixed-dim": "#d1c1d9",
              "on-surface": "#f9dcd6",
              "primary": "#ffb4a3",
              "error-container": "#93000a",
              "on-primary-container": "#5a0c00",
              "surface-bright": "#473531",
              "background": "#0F0A14",
              "on-secondary-fixed": "#211829",
              "on-tertiary-fixed": "#001f26",
              "wick-input": "#241A2C",
              "wick-accent": "#FF5A36"
            },
            "borderRadius": {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "2xl": "1rem",
              "3xl": "1.5rem",
              "full": "9999px"
            },
            "fontFamily": {
              "sans": ["Manrope", "sans-serif"]
            }
          }
        }
      }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #0F0A14;
            color: #f9dcd6;
            -webkit-tap-highlight-color: transparent;
            min-height: 100dvh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .photo-slot {
            aspect-ratio: 2/3;
            border: 2px dashed #42312d;
            background-color: #1e100d;
        }
        .photo-slot.filled {
            border: 3px solid #FF5A36;
            background-color: #2b1c18;
        }
    </style>
</head>
<body class="flex flex-col">
<!-- Header -->
<header class="sticky top-0 z-50 bg-[#0F0A14] px-4 py-4 flex items-center justify-between border-b border-surface-variant/30">
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full active:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[28px]">arrow_back</span>
</button>
<h1 class="text-[20px] font-extrabold tracking-tight text-on-surface">Profilini Düzenle</h1>
</div>
<button class="px-5 py-2 bg-wick-accent text-[#0F0A14] font-extrabold rounded-full active:scale-95 transition-transform">
            Kaydet
        </button>
</header>
<main class="flex-1 overflow-y-auto px-4 py-6 space-y-8">
<!-- Photo Grid -->
<section>
<div class="flex justify-between items-end mb-4">
<h2 class="text-label-md uppercase tracking-widest text-on-surface-variant font-extrabold">Fotoğraflar</h2>
<span class="text-[12px] text-wick-accent font-bold">En az 2 fotoğraf ekle</span>
</div>
<div class="grid grid-cols-3 gap-3">
<!-- Main Photo -->
<div class="photo-slot filled relative rounded-3xl overflow-hidden">
<img alt="Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDPlLyoTBdlhxdO61mtQ1_SqWvjLLks_LQnCjJYRiDuZ6iYs5r3lXLxtcWH_3LjgJDX8CbGmATxTFQ3It2p_770bRSukO8G2zUsqbwUT5oxqI5nuhYdEE1zZEuX0fxjEwtTScMz2cX2MZwRFqieiGTAx6hNq0eohx9Pv1nKc6mfEV1qyrEpTpzgCZXxG0KyIAar-lXo2ytE_jeUF76Y-BrlzDnczYV5SX6ChcXrNCIjHCTvxhZR8qnUxMF8fET9B1dm_ztR-2TsDUk"/>
<div class="absolute bottom-2 right-2 w-8 h-8 bg-wick-accent rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-white text-[20px]">edit</span>
</div>
</div>
<!-- Slot 2 -->
<div class="photo-slot filled relative rounded-3xl overflow-hidden">
<img alt="Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC0ubLHZdpN9gN2iaxBK3u_doadLO7lfRj2m_rSkTZol_1dUbRFbZhW8kIXDhIvZ5zknviBJnNUY75mUuW466N6wi09VI0Tc72AdL_tx1xobFzo_1aRbqcAj2umredJiyAcodEJqb59FBc19QDnqA6oasTBXLLdsbasVLMjrJPVPXLnyjcwKdtlm0NzeGbXb-uke8tQSzlHri6B8-kJ_QzJlhLLZY91N5GYENMIHknvOE0Xf6_uDl1AzW7BojuN2bScKQG0cJtUNfw"/>
<div class="absolute bottom-2 right-2 w-8 h-8 bg-error rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-on-error text-[20px]">close</span>
</div>
</div>
<!-- Empty Slots -->
<button class="photo-slot rounded-3xl flex items-center justify-center group active:bg-surface-variant/30">
<span class="material-symbols-outlined text-surface-variant text-[32px] group-active:scale-110 transition-transform">add_circle</span>
</button>
<button class="photo-slot rounded-3xl flex items-center justify-center group active:bg-surface-variant/30">
<span class="material-symbols-outlined text-surface-variant text-[32px]">add_circle</span>
</button>
<button class="photo-slot rounded-3xl flex items-center justify-center group active:bg-surface-variant/30">
<span class="material-symbols-outlined text-surface-variant text-[32px]">add_circle</span>
</button>
<button class="photo-slot rounded-3xl flex items-center justify-center group active:bg-surface-variant/30">
<span class="material-symbols-outlined text-surface-variant text-[32px]">add_circle</span>
</button>
</div>
</section>
<!-- Form Fields -->
<section class="space-y-6">
<!-- Name -->
<div class="space-y-2">
<label class="block text-sm font-extrabold text-on-surface-variant px-1 uppercase tracking-wider" for="name">Ad</label>
<input class="w-full bg-wick-input border-2 border-transparent focus:border-wick-accent focus:ring-0 rounded-2xl p-4 text-on-surface font-bold text-lg placeholder-surface-variant outline-none transition-all" id="name" placeholder="Adını gir" type="text" value="Can Berk"/>
</div>
<!-- Bio -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="text-sm font-extrabold text-on-surface-variant uppercase tracking-wider" for="bio">Hakkında</label>
<span class="text-[12px] text-surface-variant font-bold">0/500</span>
</div>
<textarea class="w-full bg-wick-input border-2 border-transparent focus:border-wick-accent focus:ring-0 rounded-2xl p-4 text-on-surface font-bold text-lg placeholder-surface-variant outline-none transition-all resize-none" id="bio" placeholder="Kendinden bahset..." rows="4"></textarea>
</div>
<!-- Gender -->
<div class="space-y-2">
<label class="block text-sm font-extrabold text-on-surface-variant px-1 uppercase tracking-wider">Cinsiyet</label>
<div class="flex gap-2">
<button class="flex-1 py-4 bg-wick-accent text-[#0F0A14] font-extrabold rounded-2xl border-2 border-wick-accent">Erkek</button>
<button class="flex-1 py-4 bg-wick-input text-on-surface font-extrabold rounded-2xl border-2 border-transparent">Kadın</button>
</div>
</div>
<!-- Interests (Extra Wick-style component) -->
<div class="space-y-4">
<label class="block text-sm font-extrabold text-on-surface-variant px-1 uppercase tracking-wider">İlgi Alanların</label>
<div class="flex flex-wrap gap-2">
<div class="px-4 py-2 bg-wick-input border-2 border-wick-accent/30 rounded-full flex items-center gap-2">
<span class="text-on-surface font-bold">🎬 Sinema</span>
</div>
<div class="px-4 py-2 bg-wick-input border-2 border-wick-accent/30 rounded-full flex items-center gap-2">
<span class="text-on-surface font-bold">🎨 Tasarım</span>
</div>
<div class="px-4 py-2 bg-wick-input border-2 border-wick-accent/30 rounded-full flex items-center gap-2">
<span class="text-on-surface font-bold">🍕 Yemek</span>
</div>
<button class="w-10 h-10 rounded-full bg-wick-accent flex items-center justify-center">
<span class="material-symbols-outlined text-[#0F0A14] font-bold">add</span>
</button>
</div>
</div>
</section>
<!-- Danger Zone -->
<section class="pt-4 pb-10">
<button class="w-full py-4 text-error font-extrabold border-2 border-error/20 rounded-2xl active:bg-error/10 transition-colors">
                Hesabı Devre Dışı Bırak
            </button>
</section>
</main>
<!-- Visual Polish: Decorative elements for 'sticker' aesthetic -->
<div class="fixed bottom-6 right-6 pointer-events-none opacity-20">
<div class="w-24 h-24 bg-wick-accent rounded-full blur-3xl"></div>
</div>
</body></html>
