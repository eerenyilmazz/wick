<script>
        // Simple micro-interaction for the dialog appearance
        document.addEventListener('DOMContentLoaded', () => {
            const dialog = document.querySelector('.tilt-card');
            dialog.style.opacity = '0';
            dialog.style.transform = 'scale(0.9) rotate(-3deg)';
            
            setTimeout(() => {
                dialog.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                dialog.style.opacity = '1';
                dialog.style.transform = 'scale(1) rotate(-1deg)';
            }, 100);
        });
    </script>
