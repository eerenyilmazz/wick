services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wick}
      POSTGRES_USER: ${POSTGRES_USER:-wick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wick}
    ports:
      - "5432:5432"
    volumes:
      - wick-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wick} -d ${POSTGRES_DB:-wick}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-wick}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-wick}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-wick}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in your .env file - see .env.example}
    volumes:
      - wick-photo-data:/app/data/photos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  wick-postgres-data:
  wick-photo-data:
