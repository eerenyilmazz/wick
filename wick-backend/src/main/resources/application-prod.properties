# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.

# Swagger/OpenAPI is a dev convenience - do not expose it publicly in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Only expose the liveness/readiness probe; metrics/info aren't worth exposing
# behind the app's user-JWT auth, and there's no separate ops auth set up yet.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.jpa.show-sql=false
