spring.application.name=wick-backend

spring.web.locale=en
spring.web.locale-resolver=fixed

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

spring.datasource.url=jdbc:postgresql://localhost:5432/wick
spring.datasource.username=wick
spring.datasource.password=wick
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true

# Set both to false before exposing this API publicly in production
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

app.jwt.secret=change-this-secret-in-production-please-use-env-var
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=2592000000

# Comma-separated list of allowed browser origins. Empty by default since the
# Android client is not subject to CORS; add origins here once a web client exists.
app.cors.allowed-origins=

app.user.minimum-age=18
app.user.maximum-age=100

app.auth.login-attempt-limit=10
app.auth.login-limit-window-minutes=15
app.auth.register-attempt-limit=5
app.auth.register-limit-window-minutes=60
app.auth.email-check-attempt-limit=20
app.auth.email-check-limit-window-minutes=60

app.match.daily-swipe-limit=200
app.match.swipe-limit-window-hours=24

app.invitation.daily-limit=3
app.invitation.limit-window-hours=24
app.invitation.max-retry-invitations=2
app.session.free-duration-minutes=20
app.session.premium-duration-minutes=40
app.session.extension-minutes=10
app.session.countdown-interval-ms=5000
app.session.fallback-check-interval-ms=60000

app.token.session-extension-cost=1
app.token.extra-invitation-cost=1
app.token.super-like-cost=1
app.token.premium-monthly-bonus=10
app.token.daily-login-claim-ttl-hours=25

# "mock" accepts any non-blank productId/purchaseToken. Switch to "google-play" once a
# service account key and real Play Console products exist (see settings below).
app.billing.webhook-secret=
app.billing.provider=mock
app.billing.google-play.service-account-key-path=
app.billing.google-play.package-name=com.wickapp.wick

# Play Console product IDs - update these once real products are created in Play Console (Monetize > Products)
app.billing.products.token_pack_5.type=TOKEN_PACK
app.billing.products.token_pack_5.amount=5
app.billing.products.token_pack_20.type=TOKEN_PACK
app.billing.products.token_pack_20.amount=20
app.billing.products.premium_monthly.type=PREMIUM_SUBSCRIPTION
app.billing.products.premium_monthly.amount=1

# "mock" just logs. Switch to "firebase" once a Firebase service account key exists.
app.notification.provider=firebase
app.notification.service-account-key-path=./firebase-service-account.json
app.notification.session-ending-soon-threshold-seconds=60

app.photo.storage-path=./data/photos
app.photo.max-photos-per-user=6
app.photo.public-url-prefix=/photos
app.photo.max-dimension-px=1080
app.photo.jpeg-quality=0.85
app.photo.max-uploads-per-day=30
app.photo.upload-limit-window-hours=24

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


app.system.maintenance-mode=false
app.system.min-version=0.1.0

app.internal.secret=wick-internal-secret-change-in-prod
app.verification.script-path=./face_verify.py
